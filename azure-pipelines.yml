trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# ---------------- CI PART ----------------
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install dependencies'

- script: |
    echo "Build successful 🚀"
  displayName: 'CI Build Complete'

# ---------------- CD PART ----------------
- task: SSH@0
  inputs:
    sshEndpoint: 'azure-vm-ssh'
    runOptions: 'commands'
    commands: |
      echo "Deploying to VM 🚀"

      rm -rf Automated-Node-Application

      git clone https://github.com/tanishka-tanu/Automated-Node-Application.git

      cd Automated-Node-Application

      sudo docker build -t node-devops-app .

      sudo docker rm -f $(sudo docker ps -aq) || true

      sudo docker run -d -p 3000:3000 node-devops-app
  displayName: 'Deploy to Azure VM'