trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# ---------------- CI PART ----------------
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install dependencies'

- script: |
    echo "Build successful 🚀"
  displayName: 'CI Done'

# ---------------- CD PART ----------------
- task: SSH@0
  inputs:
    sshEndpoint: 'azure-vm-ssh'
    runOptions: 'commands'
    commands: |
      echo "Deploying 🚀"

      # move to safe folder
      cd /home/azureuser || exit

      # remove old project
      rm -rf Automated-Node-Application

      # clone fresh repo (PUBLIC so OK)
      git clone https://github.com/tanishka-tanu/Automated-Node-Application.git

      cd Automated-Node-Application

      # rebuild docker
      sudo docker build -t node-devops-app .

      # stop old container
      sudo docker rm -f $(sudo docker ps -aq) || true

      # run new container
      sudo docker run -d -p 3000:3000 node-devops-app
  displayName: 'Deploy to Azure VM'